<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_7 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_7" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_7');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive data network representing datasets, hypotheses, and evidence nodes
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
camera.position.set(0, 0, 38);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Color tokens from Arctic Intelligence
const TEAL = new THREE.Color(0x087F8C);
const VIOLET = new THREE.Color(0x7565D9);
const NAVY_ACCENT = new THREE.Color(0x1E3A8A);
const LIGHT_BLUE = new THREE.Color(0x38BDF8);

const group = new THREE.Group();
scene.add(group);

// Generate Nodes (Datasets, Hypotheses, Evidence proofs)
const nodeCount = 42;
const nodes = [];
const nodeGeometry = new THREE.SphereGeometry(0.55, 16, 16);
const coreGeometry = new THREE.SphereGeometry(1.2, 24, 24);

// Center Anchor: Causal Engine Kernel
const centerMat = new THREE.MeshBasicMaterial({ color: TEAL });
const centerNode = new THREE.Mesh(coreGeometry, centerMat);
group.add(centerNode);

const positions = [];
for (let i = 0; i < nodeCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  const radius = 10 + Math.random() * 16;

  const x = radius * Math.sin(phi) * Math.cos(theta);
  const y = (radius * Math.sin(phi) * Math.sin(theta)) * 0.65; // flatten slightly for desktop view
  const z = radius * Math.cos(phi) * 0.8;

  const isHypothesis = i % 3 === 0;
  const isEvidence = i % 3 === 1;
  const nodeColor = isHypothesis ? VIOLET : (isEvidence ? TEAL : LIGHT_BLUE);

  const mat = new THREE.MeshBasicMaterial({ color: nodeColor });
  const mesh = new THREE.Mesh(nodeGeometry, mat);
  mesh.position.set(x, y, z);
  mesh.scale.setScalar(0.7 + Math.random() * 0.7);
  group.add(mesh);

  nodes.push({
    mesh,
    pos: new THREE.Vector3(x, y, z),
    baseY: y,
    speed: 0.001 + Math.random() * 0.002,
    phase: Math.random() * Math.PI * 2
  });
  positions.push(x, y, z);
}

// Interconnecting Network Edges
const lineMaterial = new THREE.LineBasicMaterial({
  color: 0x7565D9,
  transparent: true,
  opacity: 0.22,
  blending: THREE.AdditiveBlending
});

const linesGeometry = new THREE.BufferGeometry();
const linePositions = [];

// Connect nearest neighbor nodes and center
for (let i = 0; i < nodes.length; i++) {
  // connect to center
  if (i % 2 === 0) {
    linePositions.push(0, 0, 0);
    linePositions.push(nodes[i].pos.x, nodes[i].pos.y, nodes[i].pos.z);
  }
  for (let j = i + 1; j < nodes.length; j++) {
    const dist = nodes[i].pos.distanceTo(nodes[j].pos);
    if (dist < 9.5) {
      linePositions.push(nodes[i].pos.x, nodes[i].pos.y, nodes[i].pos.z);
      linePositions.push(nodes[j].pos.x, nodes[j].pos.y, nodes[j].pos.z);
    }
  }
}

linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
const lineSegments = new THREE.LineSegments(linesGeometry, lineMaterial);
group.add(lineSegments);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX - window.innerWidth / 2) * 0.0008;
  mouseY = (e.clientY - window.innerHeight / 2) * 0.0008;
});

// Render Loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  group.rotation.y = elapsedTime * 0.08 + targetX;
  group.rotation.x = Math.sin(elapsedTime * 0.05) * 0.15 + targetY;

  // Subtle breathing of center node
  const scale = 1.0 + Math.sin(elapsedTime * 2.0) * 0.08;
  centerNode.scale.set(scale, scale, scale);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_7 -->


</body></html>
