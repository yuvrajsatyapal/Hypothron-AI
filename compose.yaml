services:
  metadata-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hypothron
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: hypothron
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hypothron']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - metadata:/var/lib/postgresql/data
volumes:
  metadata:
